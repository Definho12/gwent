name: Teste no emulador
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: "8.11.1" }
      - name: Baixar libwebp
        run: git clone -q --depth 1 -b v1.5.0 https://github.com/webmproject/libwebp app/src/main/cpp/libwebp
      - name: Liberar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulador + testes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/emu.sh
      - name: Report errors
        if: always()
        run: |
          echo "status: $(cat emu.status 2>/dev/null)"
          { grep -E "^e: |error:|FAILED|AssertionError|Exception:|What went wrong" emu.log | grep -v "^\s*at " ; grep -h "GwentTest" shots/logcat.txt; } | head -45 | while IFS= read -r line; do echo "::warning::${line}"; done || true
          if [ "$(cat emu.status 2>/dev/null)" != "0" ]; then echo "::error::testes falharam"; fi
      - name: Publicar prints no branch "shots"
        if: always()
        run: |
          cd shots
          git init -q -b shots
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "shots ${{ github.run_number }}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" shots
      - name: Falhar se os testes falharam
        run: test "$(cat emu.status)" = "0"
